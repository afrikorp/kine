name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy Worker API + D1
    runs-on: ubuntu-latest
    outputs:
      worker-url: ${{ steps.deploy-worker.outputs.worker_url }}
      account-id: ${{ steps.cf-account.outputs.account_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Cloudflare account ID
        id: cf-account
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Impossible de résoudre l'account ID Cloudflare à partir du token. Vérifiez que CLOUDFLARE_API_TOKEN est valide et a accès à au moins un compte."
            exit 1
          fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Ensure D1/KV/R2 resources exist
        shell: bash
        run: ./scripts/ensure-cf-resources.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf-account.outputs.account_id }}

      - name: Apply D1 migrations (remote)
        working-directory: apps/api
        run: npx wrangler d1 migrations apply app-kine-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf-account.outputs.account_id }}

      - name: Deploy Worker
        id: deploy-worker
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --var ALLOWED_ORIGIN:https://app-kine.pages.dev 2>&1 | tee /tmp/wrangler-deploy.log
          WORKER_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | head -n1)
          if [ -z "$WORKER_URL" ]; then
            echo "::error::URL du Worker introuvable dans la sortie de wrangler deploy"
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf-account.outputs.account_id }}

  deploy-web:
    name: Build + Deploy Pages
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/web
        run: pnpm build
        env:
          VITE_API_URL: ${{ needs.deploy-api.outputs.worker-url }}

      - name: Ensure Cloudflare Pages project exists
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler pages project list 2>&1 | grep -qF "app-kine"; then
            echo "Projet Pages app-kine déjà présent."
          else
            echo "Pas trouvé, création du projet Pages app-kine..."
            npx wrangler pages project create app-kine --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ needs.deploy-api.outputs.account-id }}

      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        run: npx wrangler pages deploy dist --project-name=app-kine --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ needs.deploy-api.outputs.account-id }}
