name = "kine-cnam-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "kine-cnam-db"
# À remplacer par l'ID réel après `wrangler d1 create kine-cnam-db`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
# À remplacer par l'ID réel après `wrangler kv namespace create SESSIONS`.
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "FILES"
bucket_name = "kine-cnam-files"
